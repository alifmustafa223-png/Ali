const MW = 170, MD = 60;

const molBase = molGeo.attributes.position.array.slice();
function profile(d, H) {   // d = distance behind the wave front (m). crest + sloping level behind it
  if (d < -1.2) return -1;
  const lead = clamp((d + 1.2) / 1.2);
  return lead * (H * Math.exp(-Math.pow((d - 3.5) / 4.2, 2)) + (1.1 + 2.2 * Math.exp(-Math.max(0, d) / 22)));
}
function updateMolasses(st, t) {
  const p = molGeo.attributes.position.array;
  if (st.mode === "none") { mol.visible = false; return; }
  mol.visible = true;
  for (let i = 0; i < p.length; i += 3) {
    const x = molBase[i] + mol.position.x, z = molBase[i + 2] + mol.position.z;
    let y = -1;
    if (st.mode === "flood") y = st.level + 0.08 * Math.sin(x * 0.7 + t * 1.3) * Math.cos(z * 0.6 - t);
    else if (st.mode === "surge") {          // front moving +x down the street
      const d = st.front - x + 2 * Math.sin(z * 0.35 + t * 2);
      y = profile(d, st.H) * (Math.abs(z + 1) < 14 ? 1 : clamp(1 - (Math.abs(z + 1) - 14) / 6));
      if (y >= 0) y += 0.25 * Math.sin(x * 0.9 - t * 9) * Math.exp(-Math.pow((d - 3.5) / 5, 2));
    } else if (st.mode === "radial") {       // bursting out of the tank
      const r = Math.hypot(x - TANK.x, z - TANK.z);
      const d = st.front - r;
      y = r < TR ? Math.max(0.5, st.inner) : profile(d, st.H);
    }
    p[i + 1] = y < 0 ? -1.5 : y;
  }
  molGeo.attributes.position.needsUpdate = true;
  molGeo.computeVertexNormals();
}

function mkChar(name) {

const CHARS = { eddie: mkChar("eddie"), boss: mkChar("boss"), judge: mkChar("judge") };
const OUT = "#1c1310";

function limb(g, x0, y0, a1, l1, a2, l2, w, col) {   // angles in degrees, 0 = straight down, positive = toward +x
  const x1 = x0 + Math.sin(a1 * D2R) * l1, y1 = y0 + Math.cos(a1 * D2R) * l1;
  const x2 = x1 + Math.sin((a1 + a2) * D2R) * l2, y2 = y1 + Math.cos((a1 + a2) * D2R) * l2;

  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  return [x2, y2];
}
function blob(g, fill, lw = 12) { g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = OUT; g.stroke(); }

function drawProp(g, prop, x, y, t) {

    g.fillStyle = OUT; g.font = "900 40px Arial"; g.textAlign = "center"; g.fillText("ANARCHIST", 0, -95); g.fillText("BOMB?!", 0, -45);
    for (let k = 0; k < 3; k++) g.fillRect(-95, -20 + k * 0 - 0, 190, 6);
  } else if (prop === "gavel") {
    g.rotate(-0.9 + 0.9 * clamp(Math.sin(t * 6) * 2));
    g.beginPath(); g.rect(-8, -130, 16, 130); blob(g, "#7a4a24", 8);
    g.beginPath(); g.rect(-50, -170, 100, 46); blob(g, "#5a3418", 8);
  } else if (prop === "bag") {
    g.beginPath(); g.ellipse(0, 10, 70, 80, 0, 0, 7); blob(g, "#c9b07a", 9);
    g.fillStyle = OUT; g.font = "900 70px Arial"; g.textAlign = "center"; g.fillText("$", 0, 36);
  } else if (prop === "plans") {
    g.rotate(-0.08);
    g.beginPath(); g.rect(-150, -170, 300, 200); blob(g, "#2c5d9a", 9);
    g.strokeStyle = "#cfe2ff"; g.lineWidth = 4;

  camera.lookAt(f.x + amp * 0.4 * noise(t * 9, 4), f.y + amp * 0.4 * noise(t * 8, 5), f.z);
  camera.rotateZ(amp * 0.05 * noise(t * 7, 6));
  sun.target.position.copy(f); sun.position.copy(f).add(lastSeason === "dusk" ? new THREE.Vector3(-50, 16, -40) : lastSeason === "summer" ? new THREE.Vector3(-30, 80, 50) : new THREE.Vector3(-60, 55, 40));
  // billboards: yaw toward the lens
  for (const name in CHARS) { const m = CHARS[name].mesh; if (m.visible) m.rotation.y = Math.atan2(camera.position.x - m.position.x, camera.position.z - m.position.z); }
  glCanvas.style.filter = (blur > 0.3 ? `blur(${blur.toFixed(1)}px) ` : "") + (s.sepia ? "sepia(0.45) saturate(0.9)" : "");
  renderer.render(scene, camera);
  updateSubs(t);
}

// =====================================================================================================  SUBTITLES
const subs = document.getElementById("subs");
let lastKey = "";
function updateSubs(t) {
  const k = WORDS.findIndex(o => t >= o.t0 && t < o.t1 + 0.02);
  if (k < 0) { if (lastKey) { subs.innerHTML = ""; lastKey = ""; } return; }
  const line = WORDS.filter(o => o.line === WORDS[k].line);
  const idx = line.indexOf(WORDS[k]);
  const groups = [];                                   // chunks of <= 3 words and <= 17 characters (max 2 lines)
  for (const o of line) { const gp = groups[groups.length - 1];
    if (gp && gp.length < 3 && gp.map(x => x.w).join(" ").length + 1 + o.w.length <= 17) gp.push(o); else groups.push([o]); }
  const chunk = groups.find(gp => gp.includes(WORDS[k]));
  const start = line.indexOf(chunk[0]);
  const key = WORDS[k].line + ":" + start + ":" + idx;
  if (key === lastKey) return;
  lastKey = key;
  subs.innerHTML = chunk.map((o, j) => `<span class="${start + j === idx ? "on" : ""}">${o.w.replace(/[<>&]/g, "")}</span>`).join("");
}

// =====================================================================================================  GRAIN
const grain = document.getElementById("grain").getContext("2d");
const gImg = grain.createImageData(270, 480);
function updateGrain() {
  for (let i = 0; i < gImg.data.length; i += 4) { const v = Math.random() * 255; gImg.data[i] = gImg.data[i + 1] = gImg.data[i + 2] = v; gImg.data[i + 3] = 255; }
  grain.putImageData(gImg, 0, 0);
}

// =====================================================================================================  PLAYBACK
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
const vo = document.getElementById("vo");
let voOK = false;
vo.addEventListener("canplaythrough", () => { voOK = true; });
vo.addEventListener("error", () => { voOK = false; });
let T = 0, playing = false, lastNow = 0, scrubbing = false;
function setPlaying(p) {
  playing = p; playBtn.textContent = p ? "Pause" : "Play"; lastNow = performance.now();
  if (voOK) { if (p) { vo.currentTime = T; vo.play().catch(() => {}); } else vo.pause(); }
}
function seek(t) { T = clamp(t, 0, DUR); if (voOK) vo.currentTime = T; render(); }
function render() { evalFrame(T); scrub.value = T.toFixed(2); timeEl.textContent = `${T.toFixed(2)} / ${DUR.toFixed(2)}`; }
playBtn.onclick = () => { if (T >= DUR) T = 0; setPlaying(!playing); };
document.getElementById("restart").onclick = () => { seek(0); setPlaying(true); };
scrub.addEventListener("input", () => { scrubbing = true; seek(parseFloat(scrub.value)); });
scrub.addEventListener("change", () => { scrubbing = false; });
const hint = document.getElementById("hint");
document.getElementById("hide").onclick = () => {
  document.body.classList.add("recording");
  hint.classList.add("show"); setTimeout(() => hint.classList.remove("show"), 1600);
};
window.addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") document.body.classList.toggle("recording");
  else if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  else if (e.key === "r" || e.key === "R") document.getElementById("restart").click();
});
function loop(now) {
  if (playing && !scrubbing) {
    T += (now - lastNow) / 1000;
    if (voOK && Math.abs(vo.currentTime - T) > 0.08) T = vo.currentTime;   // the voice is the master clock when present
    if (T >= DUR) { T = 0; if (voOK) vo.currentTime = 0; }                  // seamless loop
  }
  lastNow = now;
  render();
  if (Math.floor(now / 50) % 2 === 0) updateGrain();
  requestAnimationFrame(loop);
}
// fit the 1080x1920 stage to the window
const stage = document.getElementById("stage");
function fit() {
  const sc = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  const x = (window.innerWidth - 1080 * sc) / 2, y = (window.innerHeight - 1920 * sc) / 2;
  stage.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
}
window.addEventListener("resize", fit);
fit();
window.__seek = t => { playing = false; seek(t); };   // for frame checks / rendering tools
updateGrain();
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
